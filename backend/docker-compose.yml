version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vigicam_postgres
    restart: always
    environment:
      POSTGRES_USER: vigicam_user
      POSTGRES_PASSWORD: vigicam_secret_2026
      POSTGRES_DB: vigicam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigicam_user -d vigicam_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: vigicam_fastapi
    restart: always
    environment:
      POSTGRES_USER: vigicam_user
      POSTGRES_PASSWORD: vigicam_secret_2026
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: vigicam_db
      DATABASE_URL: postgresql://vigicam_user:vigicam_secret_2026@db:5432/vigicam_db
      ADMIN_PIN: admin123
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
